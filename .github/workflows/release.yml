name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: Release type
        type: choice
        options: [release, beta, alpha]
        default: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next tag
        id: new_tag
        env:
          RELEASE_TYPE: ${{ inputs.type }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ ! -f VERSION ]; then
            echo "VERSION file is missing from the repository root" >&2
            exit 1
          fi

          base=$(tr -d ' \t\r\n' < VERSION)
          if ! echo "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a base like 12.1.0, got '$base'" >&2
            exit 1
          fi
          echo "Base version: $base"

          # alpha and beta tags share the build counter, so every upload outranks the one before it
          escaped=$(echo "$base" | sed 's/\./\\./g')
          build=$(git tag --list "v$base.*" \
            | { grep -E "^v$escaped\.[0-9]+(-alpha|-beta)?$" || true; } \
            | sed -E "s/^v$escaped\.//; s/-(alpha|beta)$//" \
            | sort -n \
            | tail -n 1)
          echo "Highest existing build: ${build:-none}"
          build=$(( ${build:-0} + 1 ))

          # the packager reads alpha/beta from the tag name for CurseForge, Wago and GitHub
          new_tag="v$base.$build"
          if [ "$RELEASE_TYPE" != "release" ]; then
            new_tag="$new_tag-$RELEASE_TYPE"
          fi
          echo "Tagging $new_tag"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
