name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next tag
        id: new_tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          base=$(tr -d ' \t\r\n' < VERSION)
          if ! echo "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a base like 12.1.0, got '$base'" >&2
            exit 1
          fi

          escaped=$(echo "$base" | sed 's/\./\./g')
          build=$(git tag --list "v$base.*" \
            | grep -E "^v$escaped\.[0-9]+$" \
            | sed "s/^v$base\.//" \
            | sort -n \
            | tail -n 1)
          build=$(( ${build:-0} + 1 ))

          new_tag="v$base.$build"
          echo "Tagging $new_tag"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
